<script id="seed" type="application/json">[{"id":"tin9-gk1-01","rev":1,"subj":"Tin học","chap":"Lớp 9 › Đề cương giữa HK I","name":"Tin học 9 – Đề cương giữa HK I","src":"Đề cương Tin học 9 giữa HK I, THCS Bạch Đằng, 2026-2027","qs":[
["Những thiết bị như máy rút tiền tự động (ATM), bảng điện tử hiển thị chuyến bay, hay hệ thống thu phí tự động thể hiện điều gì?","Bộ xử lí thông tin được ứng dụng rộng rãi trong nhiều lĩnh vực của đời sống.","Công nghệ chỉ xuất hiện trong lĩnh vực ngân hàng.","Các thiết bị này hoạt động độc lập, không cần xử lí thông tin.","Đó là những thiết bị chỉ phục vụ mục đích giải trí.",0],
["Bằng cách nào công nghệ thông tin có những tác động mạnh mẽ đối với giáo dục?","Giúp cho việc đánh giá kết quả học tập trở nên công bằng hơn.","Động viên, khuyến khích mọi người tham gia vào xã hội học tập.","Hỗ trợ tính toán nhanh chóng và chính xác, không cần tính nhầm.","Giúp cho việc chuyển giao và tiếp cận thông tin trở nên dễ dàng.",3],
["Bộ xử lí thông tin có vai trò gì trong các thiết bị điện tử hiện nay?","Chỉ dùng để lưu trữ dữ liệu trong thiết bị.","Dùng để kết nối các thiết bị với mạng Internet.","Giúp thiết bị vận hành linh hoạt và thực hiện các thao tác xử lí dữ liệu.","Chỉ có trong máy tính để bàn và máy tính xách tay.",2],
["Những đặc điểm nào là ưu điểm, thể hiện khả năng của máy tính?","Tính toán nhanh, lưu trữ lâu dài, kết nối toàn cầu.","Tưởng tượng phong phú, lưu trữ lớn, kết nối toàn cầu.","Tính toán nhanh, lưu trữ lớn, kết nối toàn cầu.","Tưởng tượng phong phú, lưu trữ lớn, kết nối an toàn.",2],
["Cụm từ nào sau đây được sử dụng để chỉ hệ thống máy tính mạnh mẽ về cả tốc độ tính toán và độ lớn của dữ liệu được xử lí, được chế tạo bằng cách sử dụng những công nghệ tiên tiến nhất về cả phần cứng và phần mềm?","Máy tính hiệu năng cao.","Máy tính lớn.","Siêu máy tính.","Trí tuệ nhân tạo.",2],
["Loại đồng hồ nào sau đây được gọi là bộ xử lí thông tin?","Đồng hồ quay lắc, chạy bằng dây cót.","Đồng hồ điện tử không dùng pin.","Đồng hồ quartz (thạch anh).","Đồng hồ thông minh.",3],
["Nhà quản lí căn cứ vào danh sách nhân viên vắng mặt không lí do trong một ngày để tiến hành đánh giá về chuyên cần và thái độ làm việc của nhân viên. Thông tin nhà quản lí đã vi phạm yếu tố nào của chất lượng thông tin trong đánh giá nhân viên?","Tính đầy đủ.","Tính chính xác.","Tính mới.","Tính sử dụng được.",0],
["Bước đầu tiên trong giải quyết vấn đề là:","Xác định vấn đề","Tìm kiếm thông tin","Đưa ra kết quả","Đánh giá kết quả",0],
["Trong quá trình giải quyết vấn đề, thông tin có vai trò:","Không cần thiết","Chỉ để lưu trữ","Giúp đưa ra quyết định hợp lý","Chỉ để trình bày",2],
["Thông tin chính xác có thể mô tả như thế nào?","Thông tin đúng đắn, có thể kiểm chứng được, đủ cụ thể so với vấn đề cần giải quyết.","Thông tin có nội dung gốc xác định và có đủ thẩm quyền đối với thông tin được nêu.","Thông tin được cập nhật, được thu thập đúng lúc, kịp thời để giải quyết vấn đề đặt ra.","Thông tin về mọi khía cạnh của sự kiện, cho phép nhìn nhận sự kiện một cách toàn diện.",0],
["Cụm từ nào sau đây gắn đúng nghĩa nhất với thông tin có chất lượng cao?","Thông tin đáng tin cậy.","Thông tin hữu ích.","Thông tin đầy đủ.","Thông tin chính xác.",1],
["Tiêu chí nào dưới đây KHÔNG dùng để đánh giá thông tin?","Tính chính xác","Tính cập nhật","Tính nhanh nhẹn","Tính đầy đủ",2],
["Những phương án nào sau đây là tác động tích cực của công nghệ kĩ thuật số đến đời sống con người?","Thông tin cá nhân của con người được số hóa","Sử dụng thiết bị số liên tục trong thời gian dài ảnh hưởng đến sức khỏe thể chất và tinh thần của lớp trẻ","Gia tăng ô nhiễm môi trường từ những thiết bị công nghệ số lỗi thời","Giao dịch trong thương mại tăng nhanh nhờ ứng dụng ngân hàng số",3],
["Quy định pháp lý trong sử dụng Internet nhằm:","Bảo vệ người dùng và xã hội","Tự do vô hạn","Giới hạn sáng tạo","Khuyến khích chia sẻ sai lệch",0],
["Ví dụ nào là hành vi vi phạm pháp luật khi sử dụng Internet?","Chia sẻ phần mềm hợp pháp","Học trực tuyến","Đăng tải thông tin sai sự thật","Gửi email công việc",2],
["Quyền của người dùng Internet là:","Tự ý sử dụng dữ liệu của người khác","Được bảo mật thông tin cá nhân","Đăng tải thông tin giả","Phá hoại hệ thống",1],
["Khi sử dụng Internet an toàn, em cần:","Chia sẻ mật khẩu","Dùng phần mềm lậu","Bảo vệ thông tin cá nhân","Mở mọi tệp đính kèm",2],
["Em sẽ làm gì để tránh các tác động tiêu cực của việc sử dụng công nghệ kĩ thuật số?","Sử dụng công nghệ kĩ thuật số vi phạm pháp luật và ứng xử lành mạnh, có văn hóa.","Sử dụng công nghệ kĩ thuật số một cách hiệu quả, có trách nhiệm, có văn hóa.","Sử dụng công nghệ kĩ thuật số một cách hiệu quả, không cần có mục đích sử dụng.","Sử dụng công nghệ kĩ thuật số một cách hiệu quả, ứng xử lành mạnh, không có văn hóa.",1],
["Hành vi nào sau đây không được coi là vi phạm pháp luật, thiếu văn hoá?","Viết bài giới thiệu về trường học.","Sử dụng phần mềm không có bản quyền.","Giả danh người khác để đăng tin thu hút sự chú ý.","Tham gia đánh bạc trực tuyến.",0],
["Vì sao các thiết bị điện tử như tivi, tủ lạnh được gọi là “thiết bị thông minh”?","Vì chúng có thể hoạt động mà không cần điện năng.","Vì chúng có bộ xử lí thông tin giúp thiết bị hoạt động linh hoạt và có thêm nhiều tính năng.","Vì chúng có hình dáng hiện đại, được thiết kế đẹp mắt.","Vì chúng có thể kết nối trực tiếp với Internet mà không cần bộ xử lí.",1],
["Máy tính có vai trò như thế nào trong lĩnh vực khoa học và đời sống?","Chỉ dùng để giải trí và xem phim.","Giúp con người thực hiện những tính toán phức tạp, mô phỏng, điều khiển và truy cập nguồn thông tin phong phú.","Chỉ được dùng trong trường học và cơ quan nghiên cứu.","Chỉ có khả năng lưu trữ mà không thể kết nối Internet.",1],
["Vì sao cần quan tâm đến chất lượng thông tin khi tìm kiếm và sử dụng thông tin?","Vì thông tin nào cũng có giá trị như nhau.","Vì thông tin có chất lượng cao giúp đưa ra quyết định đúng đắn và hiệu quả hơn.","Vì thông tin chất lượng thấp giúp tiết kiệm thời gian tìm kiếm.","Vì thông tin trên mạng xã hội luôn chính xác.",1],
["Trong các tiêu chí sau, tiêu chí nào thể hiện thông tin có thể được áp dụng thực tế để giải quyết vấn đề?","Tính mới.","Tính chính xác.","Tính sử dụng được.","Tính đầy đủ.",2],
["Công nghệ kĩ thuật số có thể gây ra tác động tiêu cực nào đối với con người?","Giúp con người rèn luyện thể chất tốt hơn.","Khiến con người giao tiếp nhiều hơn trong đời thực.","Gây nghiện Internet, ít giao tiếp, mất ngủ.","Làm tăng khả năng tập trung và ghi nhớ.",2],
["Nguyên nhân nào khiến thông tin cá nhân của người dùng có thể bị rò rỉ trong môi trường số?","Dữ liệu cá nhân thường được bảo mật tuyệt đối.","Người dùng không bao giờ chia sẻ thông tin cá nhân.","Dữ liệu dễ bị đánh cắp do công nghệ phát triển quy mô lớn.","Người dùng luôn sử dụng phần mềm có bản quyền.",2],
["Thế giới kĩ thuật số","a) Bộ xử lí thông tin chỉ có trong máy tính, không có trong các thiết bị điện tử khác như tivi, tủ lạnh, máy giặt.",1],
["Thế giới kĩ thuật số","b) Máy tính có thể lưu trữ và xử lí nhiều loại dữ liệu như văn bản, hình ảnh, âm thanh, video với dung lượng lớn.",0],
["Thế giới kĩ thuật số","c) Máy tính chỉ được sử dụng trong nghiên cứu khoa học, không được ứng dụng trong đời sống hằng ngày.",1],
["Thế giới kĩ thuật số","d) Công nghệ thông tin có thể mang lại cả tác động tích cực và tiêu cực cho xã hội, tùy thuộc vào cách con người sử dụng.",0],
["Thông tin trong giải quyết vấn đề","a) Thông tin là cơ sở giúp con người đưa ra các quyết định trong học tập, lao động và cuộc sống.",0],
["Thông tin trong giải quyết vấn đề","b) Chất lượng thông tin không ảnh hưởng đến việc ra quyết định, chỉ cần có thông tin là đủ.",1],
["Thông tin trong giải quyết vấn đề","c) Khi tìm kiếm và sử dụng thông tin, cần quan tâm đến độ chính xác, tính mới và tính đầy đủ của thông tin.",0],
["Thông tin trong giải quyết vấn đề","d) Trong thực tế, nếu sử dụng thông tin có kiểm chứng, người ra quyết định có thể gặp hậu quả nghiêm trọng.",1],
["Một số vấn đề pháp lý về sử dụng dịch vụ Internet","a) Công nghệ kĩ thuật số có thể ảnh hưởng tốt đến sức khỏe thể chất và tinh thần của con người như gây nghiện Internet, mất ngủ, ít giao tiếp.",1],
["Một số vấn đề pháp lý về sử dụng dịch vụ Internet","b) Thông tin cá nhân được lưu trữ trên mạng luôn được bảo vệ tuyệt đối, không thể bị rò rỉ hay đánh cắp.",1],
["Một số vấn đề pháp lý về sử dụng dịch vụ Internet","c) Khi tham gia môi trường số, người dùng cần tránh các hành vi như chia sẻ thông tin sai sự thật, sử dụng phần mềm không có bản quyền hoặc bắt nạt qua mạng.",0],
["Một số vấn đề pháp lý về sử dụng dịch vụ Internet","d) Để bảo đảm môi trường mạng an toàn và văn minh, mỗi người cần chủ động tuân thủ pháp luật, tôn trọng quyền và danh dự của người khác.",0]
]},
{"id":"gdcd9-gk1-01","rev":2,"subj":"GDCD","chap":"Lớp 9 › Đề cương giữa HK I","name":"GDCD 9 – Đề cương giữa HK I","src":"Đề cương Giáo dục công dân 9 giữa HK I, THCS Bạch Đằng, 2026-2027","qs":[
["Cá nhân xác định được mục đích cao đẹp và quyết tâm phấn đấu để đạt được mục đích nhằm đóng góp cho lợi ích cộng đồng, quốc gia và nhân loại được gọi là","sống có hoài bão.","sống có mục đích.","sống có ước mơ.","sống có lí tưởng.",3],
["Trong buổi sinh hoạt lớp, các bạn trao đổi về vai trò của lí tưởng sống đối với mỗi người. Ý kiến nào sau đây là đúng?","Lí tưởng sống chỉ cần thiết đối với những người trưởng thành.","Có lí tưởng sống giúp con người có phương hướng phấn đấu và tạo động lực vượt qua khó khăn.","Người có lí tưởng sống chỉ cần đặt mục tiêu mà không cần hành động.","Lí tưởng sống chỉ mang lại lợi ích cho bản thân, không liên quan đến cộng đồng.",1],
["Một thanh niên ở địa phương học xong đại học ngành nuôi trồng thuỷ sản đã trở về quê, áp dụng kĩ thuật mới giúp bà con nuôi trồng hiệu quả hơn và hướng dẫn nhiều bạn trẻ cùng làm. Việc làm của người thanh niên đó thể hiện điều gì?","Sống thực dụng, chỉ nghĩ đến lợi ích trước mắt của riêng bản thân mình.","Sống khép kín, hạn chế tiếp xúc với những người xung quanh mình.","Sống tuỳ hứng, chưa có định hướng rõ ràng cho tương lai của mình.","Sống có lí tưởng, gắn mục tiêu riêng với sự phát triển quê hương.",3],
["Trong thời bình, thanh niên Việt Nam thể hiện lí tưởng sống thông qua việc nào sau đây?","Học tập, lao động sáng tạo, chấp hành pháp luật và sẵn sàng bảo vệ Tổ quốc.","Tránh tham gia các hoạt động chung để chỉ tập trung cho riêng bản thân mình.","Chờ đến khi có chiến tranh mới cống hiến sức trẻ cho đất nước mình.","Ưu tiên hưởng thụ vật chất khi còn trẻ để không phải hối tiếc sau này.",0],
["Bạn P (học sinh lớp 9) mơ ước trở thành kĩ sư xây dựng để góp phần làm cho thành phố ngày càng khang trang. Dù học bài khuya, có hôm điểm chưa cao, P vẫn kiên trì ôn luyện mỗi ngày. Điều gì giúp P giữ được sự kiên trì đó?","Sự may mắn đến một cách ngẫu nhiên trong học tập.","Áp lực phải học giỏi hơn các bạn trong lớp mình.","Mong muốn được thầy cô và bạn bè khen ngợi nhiều hơn.","Lí tưởng sống tạo động lực, định hướng để vượt khó.",3],
["Một số bạn trẻ trong khu dân cư chỉ quan tâm đến việc vui chơi, không có mục tiêu phấn đấu và cho rằng: “Sống cho vui, nghĩ đến tương lai làm gì.” Lối sống đó khác với sống có lí tưởng ở điểm nào?","Chỉ khác nhau ở cách sử dụng thời gian rảnh của mỗi bạn trẻ.","Thiếu mục tiêu rõ ràng và thiếu trách nhiệm với cộng đồng.","Không khác nhau vì mỗi người có quyền sống theo ý thích riêng.","Người sống có lí tưởng không được vui chơi, giải trí lành mạnh.",1],
["Để rèn luyện lí tưởng sống đúng đắn, học sinh nên làm gì?","Xác định mục tiêu phù hợp, lập kế hoạch và kiên trì thực hiện bằng những việc làm cụ thể.","Chỉ lựa chọn mục tiêu đem lại lợi ích vật chất trước mắt cho bản thân.","Chờ người khác quyết định mục tiêu và sắp xếp mọi việc thay mình.","Thay đổi mục tiêu liên tục theo sở thích nhất thời, không cần cân nhắc.",0],
["Trong buổi sinh hoạt lớp, Hà thích nhạc dân ca còn Vy lại thích nhạc trẻ. Việc làm nào dưới đây của Hà và Vy thể hiện lòng khoan dung?","Hà chê bai sở thích âm nhạc của Vy trước cả lớp.","Vy yêu cầu Hà phải thích giống mình thì mới chơi cùng.","Hà lập nhóm riêng và không rủ Vy tham gia.","Vy lắng nghe, tôn trọng sở thích khác biệt của Hà.",3],
["Câu tục ngữ nào dưới đây nói về lòng khoan dung?","“Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao.”","“Đánh kẻ chạy đi, không ai đánh người chạy lại.”","“Uống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây.”","“Có công mài sắt, có ngày nên kim.”",1],
["Để rèn luyện lòng khoan dung, học sinh cần","ghi nhớ kĩ lỗi lầm của bạn để nhắc lại mỗi khi có dịp.","tránh tiếp xúc với những bạn có tính cách khác với mình.","sống chân thành, rộng lượng, tôn trọng sở thích của người khác.","cố gắng thay đổi sở thích của bạn cho giống với sở thích của mình.",2],
["Ở một khu dân cư tại xã Long Sơn, nhiều gia đình đến từ các tỉnh, thành khác nhau cùng sinh sống. Mọi người tôn trọng khác biệt về giọng nói, phong tục và thông cảm cho nhau những lỗi nhỏ. Điều này cho thấy khoan dung mang lại giá trị gì?","Giúp mỗi người nhanh chóng có cuộc sống giàu có hơn trước.","Giúp quan hệ giữa mọi người hoà thuận, gắn bó, đoàn kết hơn.","Giúp những lỗi lầm của mỗi người không cần phải sửa chữa nữa.","Giúp mọi người e ngại nhau nên không dám góp ý cho nhau nữa.",1],
["Khi bạn mắc lỗi và chân thành nhận lỗi, sửa chữa sai lầm, cách ứng xử nào dưới đây thể hiện lòng khoan dung?","Nhắc lại lỗi của bạn trước lớp để mọi người cùng chê cười.","Không cho bạn cơ hội sửa sai dù bạn đã chân thành nhận lỗi.","Lắng nghe, tha thứ và động viên bạn khắc phục lỗi lầm.","Đồng tình với việc bạn làm, kể cả khi việc đó là sai trái.",2],
["Hoạt động nào sau đây thể hiện sự tích cực tham gia hoạt động cộng đồng?","Chỉ dọn dẹp nhà riêng để phục vụ nhu cầu cá nhân.","Bán đồ dùng cũ để kiếm thêm tiền tiêu vặt cho bản thân.","Cùng đoàn viên đến thăm hỏi, tặng sách và hỗ trợ các em nhỏ có hoàn cảnh khó khăn.","Đi tham quan cùng gia đình để nghỉ ngơi vào dịp cuối tuần.",2],
["Hè 2026, đoàn viên, thanh niên xã Long Sơn ra quân hỗ trợ người dân cài đặt ứng dụng, đăng kí tài khoản, tra cứu thông tin và sử dụng dịch vụ công trực tuyến, phổ cập ứng dụng “Công dân số Thành phố Hồ Chí Minh”. Hoạt động này mang lại ý nghĩa nào đối với cộng đồng?","Giúp người dân sử dụng dịch vụ công thuận tiện hơn và thúc đẩy chuyển đổi số.","Thay thế vai trò của cán bộ xã trong việc giải quyết các thủ tục hành chính.","Chỉ mang lại lợi ích riêng cho các bạn đoàn viên, thanh niên tham gia.","Buộc người dân phải dùng ứng dụng thay cho các hình thức khác hiện nay.",0],
["Nhằm hưởng ứng chiến dịch chuyển đổi số tại xã Long Sơn, bạn T (học sinh lớp 9) hướng dẫn ông bà cài đặt ứng dụng VNeID, nộp hồ sơ trực tuyến; đồng thời, nhóm học sinh Trường THCS Bạch Đằng thiết kế mã QR tích hợp thông tin lịch sử Nhà Lớn Long Sơn để du khách tra cứu. Những việc làm này thể hiện","ý thức trách nhiệm, chủ động, sáng tạo khi ứng dụng công nghệ để giúp người thân và cộng đồng.","hành vi can thiệp trái phép vào công việc quản lí hành chính và việc bảo tồn di tích.","hoạt động chỉ nhằm quảng cáo thương mại, mang lại lợi ích riêng cho cá nhân.","việc làm không mang lại giá trị thực tế cho gia đình và cho địa phương.",0],
{"t":"[Đúng/Sai · Câu 1] A là một bác sĩ trẻ đầy triển vọng, sinh trưởng trong một gia đình có truyền thống trí thức. Sau khi tốt nghiệp loại ưu tại một trường đại học y khoa danh tiếng, thay vì lựa chọn làm việc tại các bệnh viện hiện đại ở trung tâm thành phố, A đã tình nguyện đến công tác tại trạm y tế ở xã đảo B - nơi điều kiện còn nhiều khó khăn và người dân đang rất cần sự hỗ trợ y tế. Trong suốt thời gian công tác, A không quản ngại gian khổ, tận tụy chăm sóc sức khoẻ cho mọi người với tinh thần trách nhiệm cao nhất. Trong một chương trình phóng sự, A chia sẻ về mục đích sống: “Tài sản quý giá nhất của mỗi người chính là sự sống, bởi hành trình ấy chúng ta chỉ được đi duy nhất một lần. Vì thế, mỗi người cần sống sao cho thật trọn vẹn và ý nghĩa, để không phải nuối tiếc vì những năm tháng trôi qua vô ích. Điều hạnh phúc nhất là khi nhìn lại, ta có thể tự hào rằng mình đã dành trọn tâm huyết và sức trẻ để đóng góp cho những giá trị tốt đẹp của cộng đồng và sự tiến bộ của xã hội.” ▸ Nhận định a) Bác sĩ A đã xác định được lí tưởng sống đúng đắn khi gắn liền mục tiêu cá nhân với sự phát triển chung của cộng đồng.","tf":1,"a":0},

{"t":"[Đúng/Sai · Câu 2] L là học sinh lớp 9, sống cùng bố mẹ là công nhân trong một khu nhà trọ ở ngoại thành Thành phố Hồ Chí Minh. L mong muốn sau này trở thành cô giáo để giúp trẻ em có hoàn cảnh khó khăn. L trao đổi với giáo viên để xác định những môn học cần cố gắng, lập thời gian biểu học tập, đăng kí tham gia câu lạc bộ “Gia sư nhí” và dành sáng Chủ nhật dạy kèm miễn phí cho các em nhỏ. Sau một học kì, kết quả môn Ngữ văn của L chưa đạt như mong muốn. L xem lại cách học, hỏi thầy cô và điều chỉnh kế hoạch thay vì bỏ cuộc. Khi bạn rủ nghỉ buổi dạy để đi chơi game, L từ chối nhưng vẫn sắp xếp thời gian giải trí hợp lí vào ngày khác. ▸ Nhận định a) Việc L xác định mục tiêu, lập kế hoạch và điều chỉnh cách học khi chưa đạt kết quả mong muốn là biểu hiện của sự chủ động phấn đấu thực hiện lí tưởng.","tf":1,"a":0},

{"t":"[Đúng/Sai · Câu 2] L là học sinh lớp 9, sống cùng bố mẹ là công nhân trong một khu nhà trọ ở ngoại thành Thành phố Hồ Chí Minh. L mong muốn sau này trở thành cô giáo để giúp trẻ em có hoàn cảnh khó khăn. L trao đổi với giáo viên để xác định những môn học cần cố gắng, lập thời gian biểu học tập, đăng kí tham gia câu lạc bộ “Gia sư nhí” và dành sáng Chủ nhật dạy kèm miễn phí cho các em nhỏ. Sau một học kì, kết quả môn Ngữ văn của L chưa đạt như mong muốn. L xem lại cách học, hỏi thầy cô và điều chỉnh kế hoạch thay vì bỏ cuộc. Khi bạn rủ nghỉ buổi dạy để đi chơi game, L từ chối nhưng vẫn sắp xếp thời gian giải trí hợp lí vào ngày khác. ▸ Nhận định c) Việc L tham gia dạy kèm miễn phí phù hợp với mục tiêu giúp đỡ trẻ em và góp phần rèn luyện bản thân.","tf":1,"a":0},

{"t":"[Đúng/Sai · Câu 3] Lớp 9D có Quân - bạn mới chuyển trường, nói chậm và ít tham gia trò chuyện cùng cả lớp. Một số bạn nhận xét: “Quân kì quặc, đừng chơi chung với bạn ấy.” Lan không đồng tình, chủ động rủ Quân vào nhóm học tập, kiên nhẫn lắng nghe ý kiến của bạn và cùng các bạn tìm hiểu sở thích của Quân. Sau một thời gian, Quân cởi mở hơn, nhóm học tập của lớp gắn bó hơn. Riêng Tú vẫn giữ định kiến và nói: “Tính cách khác mình thì không đáng để kết bạn.” ▸ Nhận định a) Việc Lan lắng nghe và tôn trọng sự khác biệt về tính cách của Quân là biểu hiện của lòng khoan dung.","tf":1,"a":0},
{"t":"[Đúng/Sai · Câu 3] Lớp 9D có Quân - bạn mới chuyển trường, nói chậm và ít tham gia trò chuyện cùng cả lớp. Một số bạn nhận xét: “Quân kì quặc, đừng chơi chung với bạn ấy.” Lan không đồng tình, chủ động rủ Quân vào nhóm học tập, kiên nhẫn lắng nghe ý kiến của bạn và cùng các bạn tìm hiểu sở thích của Quân. Sau một thời gian, Quân cởi mở hơn, nhóm học tập của lớp gắn bó hơn. Riêng Tú vẫn giữ định kiến và nói: “Tính cách khác mình thì không đáng để kết bạn.” ▸ Nhận định b) Cách ứng xử của Lan giúp Quân hoà nhập hơn và quan hệ bạn bè trong lớp trở nên gắn bó hơn.","tf":1,"a":0},

{"t":"[Đúng/Sai · Câu 3] Lớp 9D có Quân - bạn mới chuyển trường, nói chậm và ít tham gia trò chuyện cùng cả lớp. Một số bạn nhận xét: “Quân kì quặc, đừng chơi chung với bạn ấy.” Lan không đồng tình, chủ động rủ Quân vào nhóm học tập, kiên nhẫn lắng nghe ý kiến của bạn và cùng các bạn tìm hiểu sở thích của Quân. Sau một thời gian, Quân cởi mở hơn, nhóm học tập của lớp gắn bó hơn. Riêng Tú vẫn giữ định kiến và nói: “Tính cách khác mình thì không đáng để kết bạn.” ▸ Nhận định d) Để thể hiện khoan dung, các bạn nên chấp nhận cả những việc làm sai của Quân mà không cần góp ý.","tf":1,"a":1},
{"t":"[Đúng/Sai · Câu 4] Hè 2026, sinh viên Trường Đại học Kinh tế - Luật về xã Long Sơn tổ chức chiến dịch tình nguyện. Học sinh trong xã được mời nghe tuyên truyền về phòng, chống ma tuý, rồi cùng sinh viên vệ sinh khu vực hồ Mang Cá và trồng cây xanh. H (học sinh lớp 9) đăng kí tham gia. Sau buổi tuyên truyền, H dùng nội dung do ban tổ chức cung cấp để thiết kế áp phích số “Nói không với ma tuý” và chia sẻ vào nhóm Zalo của lớp. Một số bạn cho rằng: “Việc này đã có sinh viên và người lớn lo, học sinh đi làm gì cho mệt.” H giải thích: “Hồ Mang Cá là nơi chúng mình sống, cùng làm thì sẽ đẹp và an toàn hơn.” ▸ Nhận định a) Việc học sinh cùng sinh viên tình nguyện vệ sinh, trồng cây quanh hồ Mang Cá chỉ là việc riêng của từng bạn, không phải hoạt động cộng đồng.","tf":1,"a":1},
{"t":"[Đúng/Sai · Câu 4] Hè 2026, sinh viên Trường Đại học Kinh tế - Luật về xã Long Sơn tổ chức chiến dịch tình nguyện. Học sinh trong xã được mời nghe tuyên truyền về phòng, chống ma tuý, rồi cùng sinh viên vệ sinh khu vực hồ Mang Cá và trồng cây xanh. H (học sinh lớp 9) đăng kí tham gia. Sau buổi tuyên truyền, H dùng nội dung do ban tổ chức cung cấp để thiết kế áp phích số “Nói không với ma tuý” và chia sẻ vào nhóm Zalo của lớp. Một số bạn cho rằng: “Việc này đã có sinh viên và người lớn lo, học sinh đi làm gì cho mệt.” H giải thích: “Hồ Mang Cá là nơi chúng mình sống, cùng làm thì sẽ đẹp và an toàn hơn.” ▸ Nhận định b) Tham gia buổi tuyên truyền phòng, chống ma tuý và trồng cây giúp học sinh mở rộng hiểu biết, rèn luyện tinh thần trách nhiệm và góp phần xây dựng môi trường sống an toàn, xanh đẹp.","tf":1,"a":0},
{"t":"[Đúng/Sai · Câu 4] Hè 2026, sinh viên Trường Đại học Kinh tế - Luật về xã Long Sơn tổ chức chiến dịch tình nguyện. Học sinh trong xã được mời nghe tuyên truyền về phòng, chống ma tuý, rồi cùng sinh viên vệ sinh khu vực hồ Mang Cá và trồng cây xanh. H (học sinh lớp 9) đăng kí tham gia. Sau buổi tuyên truyền, H dùng nội dung do ban tổ chức cung cấp để thiết kế áp phích số “Nói không với ma tuý” và chia sẻ vào nhóm Zalo của lớp. Một số bạn cho rằng: “Việc này đã có sinh viên và người lớn lo, học sinh đi làm gì cho mệt.” H giải thích: “Hồ Mang Cá là nơi chúng mình sống, cùng làm thì sẽ đẹp và an toàn hơn.” ▸ Nhận định c) Việc H thiết kế áp phích số từ nội dung do ban tổ chức cung cấp và chia sẻ vào nhóm Zalo lớp là cách vận dụng công nghệ phù hợp để lan toả hoạt động cộng đồng.","tf":1,"a":0},
{"t":"[Đúng/Sai · Câu 4] Hè 2026, sinh viên Trường Đại học Kinh tế - Luật về xã Long Sơn tổ chức chiến dịch tình nguyện. Học sinh trong xã được mời nghe tuyên truyền về phòng, chống ma tuý, rồi cùng sinh viên vệ sinh khu vực hồ Mang Cá và trồng cây xanh. H (học sinh lớp 9) đăng kí tham gia. Sau buổi tuyên truyền, H dùng nội dung do ban tổ chức cung cấp để thiết kế áp phích số “Nói không với ma tuý” và chia sẻ vào nhóm Zalo của lớp. Một số bạn cho rằng: “Việc này đã có sinh viên và người lớn lo, học sinh đi làm gì cho mệt.” H giải thích: “Hồ Mang Cá là nơi chúng mình sống, cùng làm thì sẽ đẹp và an toàn hơn.” ▸ Nhận định d) Vì đã có sinh viên và người lớn lo nên học sinh không cần tham gia các hoạt động như vậy.","tf":1,"a":1},
{"t":"[Đúng/Sai · Câu 5] Sau một đợt mưa lớn, một số tuyến đường trong khu dân cư bị ngập, rác và cành cây chắn lối đi. Đoàn xã phối hợp với nhà trường phát động hoạt động dọn vệ sinh, hỗ trợ người cao tuổi và nhắc người dân bỏ rác đúng nơi quy định. N đăng kí tham gia cùng các bạn, thực hiện công việc theo hướng dẫn, hỏi người phụ trách khi gặp việc vượt quá khả năng và vẫn sắp xếp thời gian để hoàn thành bài tập. Một vài bạn cho rằng hoạt động này không liên quan đến học sinh nên không cần tham gia. ▸ Nhận định a) Học sinh có thể tham gia hoạt động cộng đồng phù hợp với lứa tuổi, khả năng và điều kiện an toàn.","tf":1,"a":0},
{"t":"[Đúng/Sai · Câu 5] Sau một đợt mưa lớn, một số tuyến đường trong khu dân cư bị ngập, rác và cành cây chắn lối đi. Đoàn xã phối hợp với nhà trường phát động hoạt động dọn vệ sinh, hỗ trợ người cao tuổi và nhắc người dân bỏ rác đúng nơi quy định. N đăng kí tham gia cùng các bạn, thực hiện công việc theo hướng dẫn, hỏi người phụ trách khi gặp việc vượt quá khả năng và vẫn sắp xếp thời gian để hoàn thành bài tập. Một vài bạn cho rằng hoạt động này không liên quan đến học sinh nên không cần tham gia. ▸ Nhận định b) Việc N làm theo hướng dẫn và hỏi người phụ trách khi gặp việc vượt quá khả năng thể hiện tinh thần trách nhiệm.","tf":1,"a":0},
{"t":"[Đúng/Sai · Câu 5] Sau một đợt mưa lớn, một số tuyến đường trong khu dân cư bị ngập, rác và cành cây chắn lối đi. Đoàn xã phối hợp với nhà trường phát động hoạt động dọn vệ sinh, hỗ trợ người cao tuổi và nhắc người dân bỏ rác đúng nơi quy định. N đăng kí tham gia cùng các bạn, thực hiện công việc theo hướng dẫn, hỏi người phụ trách khi gặp việc vượt quá khả năng và vẫn sắp xếp thời gian để hoàn thành bài tập. Một vài bạn cho rằng hoạt động này không liên quan đến học sinh nên không cần tham gia. ▸ Nhận định c) Vì hoạt động cộng đồng không phải nhiệm vụ học tập trên lớp nên học sinh không cần quan tâm hoặc tham gia.","tf":1,"a":1},
{"t":"[Đúng/Sai · Câu 5] Sau một đợt mưa lớn, một số tuyến đường trong khu dân cư bị ngập, rác và cành cây chắn lối đi. Đoàn xã phối hợp với nhà trường phát động hoạt động dọn vệ sinh, hỗ trợ người cao tuổi và nhắc người dân bỏ rác đúng nơi quy định. N đăng kí tham gia cùng các bạn, thực hiện công việc theo hướng dẫn, hỏi người phụ trách khi gặp việc vượt quá khả năng và vẫn sắp xếp thời gian để hoàn thành bài tập. Một vài bạn cho rằng hoạt động này không liên quan đến học sinh nên không cần tham gia. ▸ Nhận định d) Khi tham gia hoạt động cộng đồng, học sinh cần biết cân đối thời gian để vừa thực hiện trách nhiệm với cộng đồng vừa bảo đảm việc học.","tf":1,"a":0}

{"id":"su9-gk1-01","rev":1,"subj":"Lịch sử","chap":"Lớp 9 › Đề cương giữa HK I","name":"Lịch sử 9 – Đề cương giữa HK I (2026–2027)","src":"Đề cương Lịch sử - Địa lí 9 giữa HK I, THCS Bạch Đằng, 2026-2027 (+ Lich_su_9_dung_sai.docx, Câu 8)","qs":[["Để đưa nước Nga Xô viết thoát khỏi khủng hoảng kinh tế - chính trị sau chiến tranh, tháng 3/1921, Lê-nin và Đảng Bôn-she-vích đã đề xướng chính sách nào?","Chính sách Cộng sản thời chiến.","Chính sách kinh tế mới (NEP).","Chính sách công nghiệp hóa xã hội chủ nghĩa.","Chính sách Mới (New Deal).",1],["Nội dung nào sau đây không nằm trong Chính sách kinh tế mới (NEP) của nước Nga?","Thay chế độ trưng thu lương thực thừa bằng thuế lương thực.","Cho phép tư nhân mở các doanh nghiệp nhỏ.","Tự do buôn bán, trao đổi hàng hóa và lưu hành tiền tệ.","Nhà nước nắm toàn bộ nền kinh tế, cấm thương nghiệp tư nhân.",3],["Để vượt qua cuộc Đại suy thoái kinh tế (1929 – 1933), Tổng thống Mỹ Ru-dơ-ven đã thực hiện giải pháp nào?","Thiết lập chế độ độc tài phát xít.","Thực hiện Chính sách Mới (New Deal).","Tăng cường chiến tranh bành trướng thuộc địa.","Áp dụng Chính sách Cộng sản thời chiến.",1],["Các nước Đức, Ý, Nhật Bản đã giải quyết cuộc khủng hoảng kinh tế 1929 – 1933 bằng con đường nào?","Tiến hành cải cách kinh tế - xã hội ôn hòa.","Phát xít hóa bộ máy nhà nước và gây chiến tranh chia lại thế giới.","Trút hậu quả khủng hoảng sang các nước thuộc địa.","Mở rộng giao thương quốc tế và thu hút đầu tư nước ngoài.",1],["Sự kiện nào đánh dấu Chiến tranh thế giới thứ hai (1939 – 1945) bùng nổ?","Đức bất ngờ tấn công Liên Xô.","Nhật Bản tấn công Trân Châu Cảng của Mỹ.","Đức tấn công Ba Lan, Anh và Pháp tuyên chiến với Đức.","Mỹ thả hai quả bom nguyên tử xuống Nhật Bản.",2],["Sau Chiến tranh thế giới thứ nhất, thực dân Pháp đã tiến hành chương trình gì ở Việt Nam?","Khai thác thuộc địa lần thứ nhất.","Khai thác thuộc địa lần thứ hai.","Cải cách ruộng đất và phát triển công nghiệp nặng.","Đổi mới kinh tế theo hướng thị trường.",1],["Sự kiện nào vào năm 1920 đánh dấu bước ngoặt trong hoạt động cách mạng của Nguyễn Ái Quốc — từ một người yêu nước trở thành một chiến sĩ cộng sản?","Bắt gặp Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của Lê-nin và bỏ phiếu tán thành gia nhập Quốc tế Cộng sản.","Sáng lập Hội Việt Nam Cách mạng Thanh niên tại Quảng Châu.","Chủ trì Hội nghị hợp nhất các tổ chức cộng sản tại Cửu Long (Hương Cảng).","Gửi Bản yêu sách của nhân dân An Nam đến Hội nghị Véc-xai.",0],["Đảng Cộng sản Việt Nam được thành lập vào thời gian nào và tại đâu?","Tháng 6/1925 tại Quảng Châu (Trung Quốc).","Tháng 2/1930 tại Cửu Long, Hương Cảng (Trung Quốc).","Tháng 10/1930 tại Ma Cao (Trung Quốc).","Tháng 12/1920 tại Tua (Pháp).",1],["Đỉnh cao của Phong trào cách mạng 1930 – 1931 ở Việt Nam là sự ra đời của chính quyền nào?","Chính phủ lâm thời Nước Việt Nam Dân chủ Cộng hòa.","Các Xô viết ở Nghệ An và Hà Tĩnh.","Mặt trận Việt Minh.","Ủy ban Dân tộc giải phóng Việt Nam.",1],["Sự kiện nào trực tiếp tạo thời cơ \"ngàn năm có một\" cho nhân dân Việt Nam tiến hành Tổng khởi nghĩa tháng Tám năm 1945?","Nhật đảo chính Pháp ở Đông Dương (3/1945).","Bác Hồ về nước trực tiếp lãnh đạo cách mạng (1/1941).","Phát xít Nhật đầu hàng Đồng minh không điều kiện (8/1945).","Liên Xô tiêu diệt hoàn toàn phát xít Đức ở Châu Âu (5/1945).",2],{"t":"[Đúng/Sai · Câu 1] Đọc đoạn tư liệu sau về Chính sách kinh tế mới (NEP) năm 1921 ở Nga: “Sự thay đổi cơ bản trong NEP là chuyển từ chế độ trưng thu lương thực thừa sang thuế lương thực. Sau khi nộp đủ thuế, nông dân được toàn quyền sử dụng số nông sản còn lại và tự do trao đổi, buôn bán trên thị trường.” ▸ Nhận định a) Chính sách kinh tế mới do Lê-nin đề xướng trong bối cảnh nước Nga khủng hoảng sau chiến tranh.","tf":1,"a":0,"e":"NEP được Lê-nin đề xướng vào tháng 3/1921, khi nước Nga Xô viết khủng hoảng kinh tế - chính trị sau chiến tranh."},{"t":"[Đúng/Sai · Câu 1] Đọc đoạn tư liệu sau về Chính sách kinh tế mới (NEP) năm 1921 ở Nga: “Sự thay đổi cơ bản trong NEP là chuyển từ chế độ trưng thu lương thực thừa sang thuế lương thực. Sau khi nộp đủ thuế, nông dân được toàn quyền sử dụng số nông sản còn lại và tự do trao đổi, buôn bán trên thị trường.” ▸ Nhận định b) Chế độ trưng thu lương thực thừa tiếp tục được duy trì và mở rộng trong NEP.","tf":1,"a":1,"e":"NEP thay chế độ trưng thu lương thực thừa bằng thuế lương thực (đoạn tư liệu)."},{"t":"[Đúng/Sai · Câu 1] Đọc đoạn tư liệu sau về Chính sách kinh tế mới (NEP) năm 1921 ở Nga: “Sự thay đổi cơ bản trong NEP là chuyển từ chế độ trưng thu lương thực thừa sang thuế lương thực. Sau khi nộp đủ thuế, nông dân được toàn quyền sử dụng số nông sản còn lại và tự do trao đổi, buôn bán trên thị trường.” ▸ Nhận định c) Việc cho phép tự do trao đổi, buôn bán đã góp phần phục hồi nền kinh tế Nga Xô viết.","tf":1,"a":0,"e":"Tự do trao đổi, buôn bán giúp nền kinh tế Nga Xô viết nhanh chóng vượt qua khủng hoảng, phục hồi và phát triển."},{"t":"[Đúng/Sai · Câu 1] Đọc đoạn tư liệu sau về Chính sách kinh tế mới (NEP) năm 1921 ở Nga: “Sự thay đổi cơ bản trong NEP là chuyển từ chế độ trưng thu lương thực thừa sang thuế lương thực. Sau khi nộp đủ thuế, nông dân được toàn quyền sử dụng số nông sản còn lại và tự do trao đổi, buôn bán trên thị trường.” ▸ Nhận định d) NEP đánh dấu sự rút lui hoàn toàn của Nhà nước Xô viết khỏi việc quản lý kinh tế.","tf":1,"a":1,"e":"Nhà nước Xô viết vẫn nắm các ngành kinh tế then chốt; NEP chỉ cho phép tư nhân hoạt động ở phạm vi nhất định."},{"t":"[Đúng/Sai · Câu 2] Đọc đoạn tư liệu sau về Chiến tranh thế giới thứ hai (1939 – 1945): “Chiến tranh thế giới thứ hai kết thúc với sự thất bại hoàn toàn của khối phát xít Đức, Ý, Nhật. Chiến thắng này có vai trò quyết định của các lực lượng Đồng minh, đặc biệt là Liên Xô, Mỹ và Anh.” ▸ Nhận định a) Khối phát xít gây ra chiến tranh gồm ba nước trụ cột là Đức, Ý và Nhật Bản.","tf":1,"a":0,"e":"Đoạn tư liệu nêu khối phát xít gồm Đức, Ý, Nhật."},{"t":"[Đúng/Sai · Câu 2] Đọc đoạn tư liệu sau về Chiến tranh thế giới thứ hai (1939 – 1945): “Chiến tranh thế giới thứ hai kết thúc với sự thất bại hoàn toàn của khối phát xít Đức, Ý, Nhật. Chiến thắng này có vai trò quyết định của các lực lượng Đồng minh, đặc biệt là Liên Xô, Mỹ và Anh.” ▸ Nhận định b) Mỹ là nước duy nhất có vai trò quyết định tiêu diệt hoàn toàn chủ nghĩa phát xít.","tf":1,"a":1,"e":"Đoạn tư liệu nêu vai trò quyết định của các lực lượng Đồng minh, đặc biệt là Liên Xô, Mỹ và Anh — không chỉ riêng Mỹ."},{"t":"[Đúng/Sai · Câu 2] Đọc đoạn tư liệu sau về Chiến tranh thế giới thứ hai (1939 – 1945): “Chiến tranh thế giới thứ hai kết thúc với sự thất bại hoàn toàn của khối phát xít Đức, Ý, Nhật. Chiến thắng này có vai trò quyết định của các lực lượng Đồng minh, đặc biệt là Liên Xô, Mỹ và Anh.” ▸ Nhận định c) Chiến tranh thế giới thứ hai để lại hậu quả nặng nề, khiến hơn 60 triệu người chết.","tf":1,"a":0,"e":"Chiến tranh thế giới thứ hai làm hơn 60 triệu người chết và gây tàn phá nặng nề."},{"t":"[Đúng/Sai · Câu 2] Đọc đoạn tư liệu sau về Chiến tranh thế giới thứ hai (1939 – 1945): “Chiến tranh thế giới thứ hai kết thúc với sự thất bại hoàn toàn của khối phát xít Đức, Ý, Nhật. Chiến thắng này có vai trò quyết định của các lực lượng Đồng minh, đặc biệt là Liên Xô, Mỹ và Anh.” ▸ Nhận định d) Thắng lợi của phe Đồng minh đã tạo điều kiện thuận lợi cho phong trào giải phóng dân tộc trên thế giới phát triển.","tf":1,"a":0,"e":"Chiến thắng của phe Đồng minh tạo điều kiện thuận lợi cho phong trào giải phóng dân tộc phát triển."},{"t":"[Đúng/Sai · Câu 8] Đọc đoạn tư liệu về quá trình phân hóa và thành lập Đảng. “Năm 1929, phong trào công nhân và phong trào yêu nước phát triển mạnh mẽ, đặt ra yêu cầu bức thiết phải thành lập một đảng cộng sản để lãnh đạo cách mạng. Ba tổ chức cộng sản lần lượt ra đời ở Bắc Kỳ, Trung Kỳ và Nam Kỳ nhưng hoạt động chia rẽ, tranh giành ảnh hưởng lẫn nhau.” ▸ Nhận định a) Sự ra đời của ba tổ chức cộng sản năm 1929 chứng tỏ phong trào cách mạng Việt Nam đã hoàn toàn phát triển và chín muồi.","tf":1,"a":1,"e":"Phong trào phát triển mạnh mẽ, nhưng ba tổ chức hoạt động chia rẽ, tranh giành ảnh hưởng lẫn nhau nên chưa thể nói là “hoàn toàn” chín muồi; vẫn cần một đảng thống nhất."},{"t":"[Đúng/Sai · Câu 8] Đọc đoạn tư liệu về quá trình phân hóa và thành lập Đảng. “Năm 1929, phong trào công nhân và phong trào yêu nước phát triển mạnh mẽ, đặt ra yêu cầu bức thiết phải thành lập một đảng cộng sản để lãnh đạo cách mạng. Ba tổ chức cộng sản lần lượt ra đời ở Bắc Kỳ, Trung Kỳ và Nam Kỳ nhưng hoạt động chia rẽ, tranh giành ảnh hưởng lẫn nhau.” ▸ Nhận định b) Việc ba tổ chức cộng sản hoạt động chia rẽ đặt ra yêu cầu cấp bách phải có một tổ chức đảng thống nhất trong cả nước.","tf":1,"a":0,"e":"Ba tổ chức hoạt động chia rẽ, tranh giành ảnh hưởng nên đặt ra yêu cầu bức thiết phải thành lập một đảng cộng sản thống nhất để lãnh đạo cách mạng."},{"t":"[Đúng/Sai · Câu 8] Đọc đoạn tư liệu về quá trình phân hóa và thành lập Đảng. “Năm 1929, phong trào công nhân và phong trào yêu nước phát triển mạnh mẽ, đặt ra yêu cầu bức thiết phải thành lập một đảng cộng sản để lãnh đạo cách mạng. Ba tổ chức cộng sản lần lượt ra đời ở Bắc Kỳ, Trung Kỳ và Nam Kỳ nhưng hoạt động chia rẽ, tranh giành ảnh hưởng lẫn nhau.” ▸ Nhận định c) Hội nghị thành lập Đảng đầu năm 1930 do Nguyễn Ái Quốc chủ trì diễn ra tại Hương Cảng (Trung Quốc).","tf":1,"a":0,"e":"Kiến thức SGK (không có trong đoạn tư liệu): Nguyễn Ái Quốc chủ trì hội nghị hợp nhất các tổ chức cộng sản tại Hương Cảng (Trung Quốc) vào đầu năm 1930."},{"t":"[Đúng/Sai · Câu 8] Đọc đoạn tư liệu về quá trình phân hóa và thành lập Đảng. “Năm 1929, phong trào công nhân và phong trào yêu nước phát triển mạnh mẽ, đặt ra yêu cầu bức thiết phải thành lập một đảng cộng sản để lãnh đạo cách mạng. Ba tổ chức cộng sản lần lượt ra đời ở Bắc Kỳ, Trung Kỳ và Nam Kỳ nhưng hoạt động chia rẽ, tranh giành ảnh hưởng lẫn nhau.” ▸ Nhận định d) Cương lĩnh chính trị đầu tiên của Đảng do Nguyễn Ái Quốc soạn thảo xác định tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản.","tf":1,"a":0,"e":"Kiến thức SGK (không có trong đoạn tư liệu): Cương lĩnh chính trị đầu tiên (2-1930) xác định con đường “tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản”."}]},
{"id":"dia9-gk1-01","rev":2,"subj":"Địa lí","chap":"Lớp 9 › Đề cương giữa HK I","name":"Địa lí 9 – Đề cương giữa HK I (2026–2027)","src":"Đề cương Lịch sử - Địa lí 9 giữa HK I, THCS Bạch Đằng, 2026-2027 (+ Dia_li_9_tra_loi_ngan.docx)","qs":[["Việt Nam là một quốc gia đa dân tộc với bao nhiêu dân tộc cùng sinh sống?","52 dân tộc.","54 dân tộc.","56 dân tộc.","63 dân tộc.",1],["Dân tộc nào chiếm tỉ lệ lớn nhất trong tổng dân số nước ta?","Tày.","Thái.","Kinh.","Mường.",2],["Hiện nay, cơ cấu dân số theo độ tuổi của nước ta đang trong thời kỳ nào?","Dân số trẻ.","Dân số vàng.","Dân số già.","Suy giảm dân số.",1],["Dân cư nước ta tập trung đông đúc nhất ở khu vực nào sau đây?","Vùng trung du và miền núi.","Vùng đồng bằng và ven biển.","Vùng cao nguyên.","Vùng biên giới phía Bắc.",1],["Vùng trồng cây công nghiệp lâu năm (cà phê, cao su, hồ tiêu, điều...) lớn nhất nước ta là","Đồng bằng sông Hồng.","Tây Nguyên và Đông Nam Bộ.","Đồng bằng sông Cửu Long.","Bắc Trung Bộ.",1],["Vùng sản xuất lương thực (lúa gạo) lớn nhất Việt Nam hiện nay là","Đồng bằng sông Hồng.","Duyên hải miền Trung.","Đồng bằng sông Cửu Long.","Trung du và miền núi Bắc Bộ.",2],["Tỉ lệ dân thành thị ở nước ta có xu hướng gia tăng chủ yếu do","Tốc độ công nghiệp hóa và đô thị hóa phát triển.","Dân số nông thôn giảm mạnh do dịch bệnh.","Mở rộng ranh giới hành chính các xã nông thôn.","Mức sinh của dân thành thị tăng rất cao.",0],["Ngành nuôi trồng thủy sản nước lợ ở nước ta phát triển mạnh ở vùng nào?","Các hồ thủy điện miền núi.","Các bãi bồi, rừng ngập mặn ven biển, cửa sông.","Vùng sông ngòi miền núi cao.","Các vùng cao nguyên nội địa.",1],["Chăn nuôi lợn và gia cầm ở nước ta tập trung nhiều nhất ở các vùng đồng bằng chủ yếu do","Đất đai rộng lớn, khí hậu mát mẻ.","Nguồn thức ăn dồi dào và thị trường tiêu thụ rộng lớn.","Ít chịu ảnh hưởng của thiên tai và dịch bệnh.","Có nhiều đồng cỏ tự nhiên rộng lớn.",1],["Việc phân bố lại dân cư và lao động trên phạm vi cả nước nhằm mục đích chủ yếu nào?","Giảm mật độ function studioReadQuestionField(t){const i=Number(t.dataset.si),q=STUDIO_RESULT[i];if(!q)return;const f=t.dataset.studioField;if(f==='question')q.t=t.value;else if(f==='explanation')q.e=t.value;else if(f==='answer')q.a=t.value===''?null:Number(t.value);else if(f==='option'){const j=Number(t.dataset.so);q.o[j]=t.value}}
function studioNormalizeHeader(v){return String(v||'').replace(/^\uFEFF/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'')}
function studioDetectDelimiter(text){const line=String(text).split(/\r?\n/).find(x=>x.trim())||'';let best=',',score=-1;for(const d of [',',';','\t']){let n=0,q=false;for(let i=0;i<line.length;i++){if(line[i]==='"'){if(q&&line[i+1]==='"'){i++;continue}q=!q}else if(!q&&line[i]===d)n++}if(n>score){score=n;best=d}}return best}
function studioParseDelimited(text,delimiter){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>String(v).trim()))rows.push(row);if(quoted)throw new Error('Tệp CSV có dấu ngoặc kép chưa được đóng.');return rows}
function studioCell(row,index){return index>=0?String(row[index]??'').trim():''}
function studioAnswerIndex(value,options=[]){const v=studioNormalizeHeader(value).replace(/^(dap an|answer|correct answer|phuong an)\s*/,'');if(['a','1','0'].includes(v))return 0;if(['b','2'].includes(v))return 1;if(['c','3'].includes(v))return 2;if(['d','4'].includes(v))return 3;const m=v.match(/^(?:option|phuongan)?([abcd])$/);if(m)return 'abcd'.indexOf(m[1]);if(Array.isArray(options)){const raw=String(value??'').trim().replace(/^[ABCD][.)\-:]\s*/i,'');const n=studioNormalizeHeader(raw);const ix=options.findIndex(o=>studioNormalizeHeader(o)===n);if(ix>=0)return ix;}return null}
function studioCleanExternalContent(text){
 let s=String(text||'').replace(/^\uFEFF/,'').trim();
 const fence=s.match(/^```(?:json|csv|text)?\s*([\s\S]*?)\s*```$/i);if(fence)s=fence[1].trim();
 if(!s.startsWith('{')&&!s.startsWith('[')){
  const jsonStart=[s.indexOf('{'),s.indexOf('[')].filter(x=>x>=0).sort((a,b)=>a-b)[0];
  if(jsonStart!==undefined){const objEnd=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));if(objEnd>jsonStart)s=s.slice(jsonStart,objEnd+1).trim();}
  else{
   const lines=s.split(/\r?\n/),headerIndex=lines.findIndex(line=>{const h=line.split(/[,;\t]/).map(studioNormalizeHeader);return h.includes('question')&&h.includes('type')&&h.includes('answer')});

function studioQuestionListFromJSON(data){

 const meta={title:data.title||data.name||data.set?.title||data.set?.name,subject:data.subject||data.set?.subject,grade:data.grade||data.set?.grade};
 if(Array.isArray(data.questions))return{items:data.questions,meta};
 if(Array.isArray(data.qs))return{items:data.qs,meta};
 if(Array.isArray(data.items))return{items:data.items,meta};
 for(const nested of [data.quiz,data.data,data.result,data.output,data.bank])if(nested&&typeof nested==='object'){for(const key of ['questions','qs','items'])if(Array.isArray(nested[key]))return{items:nested[key],meta:{...meta,title:meta.title||nested.title||nested.name,subject:meta.subject||nested.subject,grade:meta.grade||nested.grade}}}

 if(data.set&&Array.isArray(data.set.questions))return{items:data.set.questions,meta:{...meta,...data.set}};

}
function studioJsonAnswerIndex(x,options){
 if(Number.isInteger(x.answerIndex)&&x.answerIndex>=0&&x.answerIndex<4)return x.answerIndex;
 if(Number.isInteger(x.correctIndex)&&x.correctIndex>=0&&x.correctIndex<4)return x.correctIndex;
 if(Number.isInteger(x.a)&&x.a>=0&&x.a<4)return x.a;
 const raw=x.answer??x.correctAnswer??x.correct_option??x.a;
 if(typeof raw==='number'&&Number.isInteger(raw)&&raw>=0&&raw<4)return raw;
 const str=String(raw??'').trim();
 const m=str.match(/^\s*([ABCD])(?:\s*[.)\-:]|\s*$)/i);if(m)return 'ABCD'.indexOf(m[1].toUpperCase());

function studioParseJSONQuestions(text){

 items.forEach((x,i)=>{
  if(Array.isArray(x)){
   if(x.length>=6){x={type:'mcq',question:x[0],options:x.slice(1,5),answerIndex:Number(x[5])}}
   else{errors.push(`Câu ${i+1}: định dạng mảng cũ không được nhận diện.`);return;}
  }
  if(!x||typeof x!=='object'){errors.push(`Câu ${i+1}: dữ liệu không phải object.`);return;}
  const question=String(x.question??x.t??x.text??x.prompt??'').trim();if(!question){errors.push(`Câu ${i+1}: thiếu nội dung câu hỏi.`);return;}
  const type=studioNormalizeHeader(x.type??(x.tf?'tf':'mcq'));
  const isTF=['tf','truefalse','dungsai','truefalsequestion','boolean'].includes(type)||x.tf===1||x.tf===true;
  const difficulty=studioNormalizeHeader(x.difficulty??x.level??x.d),d=difficulty==='easy'||difficulty==='de'||difficulty==='nhanbiet'?'easy':difficulty==='hard'||difficulty==='kho'||difficulty==='vandungcao'?'hard':'medium';
  const reviewRaw=x.needsReview??x.needs_review??x.review??x.check??false;
  const base={t:question,e:String(x.explanation??x.e??x.rationale??x.solution??x.reason??''),d,topic:String(x.topic??x.chapter??x.category??''),source:String(x.source??x.page??x.reference??`JSON · câu ${i+1}`),needsReview:reviewRaw===true||reviewRaw===1||/^(true|yes|1|co|c)$/i.test(String(reviewRaw)),include:true};
  if(isTF){
   let answer=x.answerBoolean??x.isTrue??x.answer??x.a;
   let a=null;
   if(typeof answer==='boolean')a=answer?0:1;
   else if(typeof answer==='number'&&(answer===0||answer===1))a=answer;
   else{const k=studioNormalizeHeader(answer);if(['dung','true','yes','t'].includes(k))a=0;else if(['sai','false','no','f'].includes(k))a=1;}
   if(a===null)base.needsReview=true;
   questions.push({...base,tf:1,a});
  }else{
   let options=x.options??x.o??x.choices??x.answers;
   if(options&&typeof options==='object'&&!Array.isArray(options))options=['A','B','C','D'].map(k=>options[k]??options[k.toLowerCase()]);
   if(typeof options==='string')options=options.split(/\r?\n|\s*[|;]\s*/).map(v=>v.replace(/^[ABCD][.)\-:]\s*/i,''));
   if(!Array.isArray(options))options=[x.A??x.a1??x.optionA,x.B??x.b1??x.optionB,x.C??x.c1??x.optionC,x.D??x.d1??x.optionD];
   options=options.map(v=>String(v??'').trim());
   if(options.length!==4||options.some(v=>!v)){errors.push(`Câu ${i+1}: MCQ phải có đủ 4 phương án.`);return;}

function studioParseCSVQuestions(text){

 const headers=rows[0].map(studioNormalizeHeader),idx=(...names)=>{for(const n of names){const k=headers.indexOf(studioNormalizeHeader(n));if(k>=0)return k}return -1};
 const ix={type:idx('type','loai','dang','dạng câu hỏi'),q:idx('question','cauhoi','noidung','câu hỏi','nội dung'),a:idx('a','optiona','phuonga','phương án a'),b:idx('b','optionb','phuongb','phương án b'),c:idx('c','optionc','phuongc','phương án c'),d:idx('d','optiond','phuongd','phương án d'),options:idx('options','phuongan','cacphuongan'),answer:idx('answer','dapan','đáp án'),ex:idx('explanation','giaithich','giải thích'),diff:idx('difficulty','dokho','độ khó'),topic:idx('topic','chude','chủ đề'),source:idx('source','nguon','nguồn'),review:idx('needsreview','cankiemtra')};

 for(let r=1;r<rows.length;r++){

function studioParsePlainText(text){
 const raw=studioCleanExternalContent(text).replace(/\r/g,'');

 if(!starts.length)throw new Error('Không nhận diện được câu hỏi. Hãy dùng JSON, CSV hoặc văn bản có đánh số câu và đáp án.');

 chunks.forEach((chunk,i)=>{
  const lines=chunk.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;
  let first=lines[0].replace(/^(?:Câu|Question|Q)\s*#?\s*\d+\s*[.):\-]?\s*|^\d+\s*[.):]\s*/i,'').trim();
  const opts={};let answer='',explanation='',topic='',difficulty='medium',source=`Văn bản AI · câu ${i+1}`,questionLines=[];
  let mode='q';
  for(let j=0;j<lines.length;j++){
   const line=lines[j],om=line.match(/^([A-D])\s*[).:\-]\s*(.+)$/i);

   const am=line.match(/^(?:đáp\s*án|answer|correct\s*answer|đáp\s*án\s*đúng)\s*[:：\-]\s*(.+)$/i);
   if(am){answer=am[1].trim();mode='answer';continue;}
   const em=line.match(/^(?:giải\s*thích|explanation|lý\s*do|reason)\s*[:：\-]\s*(.*)$/i);
   if(em){explanation=em[1].trim();mode='explanation';continue;}
   const tm=line.match(/^(?:chủ\s*đề|topic|chapter)\s*[:：\-]\s*(.+)$/i);if(tm){topic=tm[1].trim();continue;}
   const dm=line.match(/^(?:độ\s*khó|difficulty)\s*[:：\-]\s*(.+)$/i);if(dm){difficulty=studioNormalizeHeader(dm[1]);continue;}

  }

  const d=['easy','de','nhanbiet'].includes(difficulty)?'easy':['hard','kho','vandungcao'].includes(difficulty)?'hard':'medium';
  const base={t,e:explanation,d,topic,source,needsReview:false,include:true};

  if(optionList.every(Boolean)){
   const a=studioAnswerIndex(answer,optionList);if(a===null)base.needsReview=true;
   questions.push({...base,o:optionList,a});
  }else if(/^(đúng|sai|true|false)$/i.test(answer)){
   const a=/^(đúng|true)$/i.test(answer)?0:1;questions.push({...base,tf:1,a});
  }else{errors.push(`Câu ${i+1}: chưa đủ A/B/C/D hoặc thiếu đáp án Đúng/Sai.`);}
 });
 if(!questions.length)throw new Error(errors[0]||'Không tìm thấy câu hỏi hợp lệ trong văn bản.');

}

- Không tráo lẫn số liệu giữa các năm, vùng hay đơn vị; explanation nêu căn cứ từ bảng/biểu đồ/tài liệu.`},
  'Tin học':{label:'Tin học · Thuật toán, dữ liệu, lập trình, an toàn số',rules:`CHUYÊN MÔN TIN HỌC

- Với mã lệnh, giữ nguyên cú pháp và phân biệt ngôn ngữ/môi trường. Kiểm tra logic của đoạn mã trước khi chốt đáp án; không tạo đoạn mã giả định như thể đã chạy thử.
- Với an toàn số, tập trung nhận biết rủi ro, quyền riêng tư, ứng xử và cách sử dụng có trách nhiệm; không đưa hướng dẫn xâm nhập hay phá hoại hệ thống.

  'Giáo dục công dân':{label:'Giáo dục công dân · Quyền, nghĩa vụ, đạo đức, tình huống',rules:`CHUYÊN MÔN GIÁO DỤC CÔNG DÂN
- Tập trung khái niệm, biểu hiện, ý nghĩa, quyền và nghĩa vụ, trách nhiệm, chuẩn mực đạo đức, pháp luật và tình huống ứng xử trong đời sống.

- Phân biệt rõ vi phạm pháp luật, vi phạm đạo đức và hành vi chưa phù hợp; không gán hậu quả pháp lý nếu tài liệu không nêu căn cứ.
- Bám sát nội dung và độ tuổi/lớp học; giải thích vì sao phương án đúng phù hợp với khái niệm hoặc nguyên tắc trong tài liệu.`},
  'Công nghệ':{label:'Công nghệ · Thiết kế, vật liệu, kĩ thuật, an toàn',rules:`CHUYÊN MÔN CÔNG NGHỆ
- Phân loại theo thiết kế kĩ thuật, quy trình thiết kế, bản vẽ, vật liệu, cơ khí, điện, trồng trọt/chăn nuôi, thực phẩm hoặc lĩnh vực đúng với tài liệu và lớp học.
- Kiểm tra đúng tên bộ phận, công dụng, kí hiệu, quy trình, thông số và nguyên lí; không tự tạo thông số kỹ thuật.
- Với câu về điện, máy móc, dụng cụ hoặc hóa chất, chỉ hỏi kiến thức nhận biết và nguyên tắc an toàn; không tạo yêu cầu thực hành nguy hiểm.
- Câu hỏi tình huống phải có bối cảnh đủ rõ, phương án an toàn và phù hợp chương trình; explanation nêu nguyên lí hoặc quy tắc liên quan.`},
  'Vật lí':{label:'Vật lí · Định luật, công thức, hiện tượng và đơn vị',rules:`CHUYÊN MÔN VẬT LÍ
- Tập trung hiện tượng, đại lượng, định luật, đồ thị, mạch điện và bài tập vận dụng đúng chương trình lớp học.
- Mọi bài tính phải ghi dữ kiện, đổi đơn vị khi cần, chọn đúng công thức và kiểm tra thứ nguyên/kết quả.
- Không bỏ điều kiện áp dụng định luật; tránh số liệu khiến nhiều đáp án đúng do sai số hoặc quy ước không nêu.`},
  'Hóa học':{label:'Hóa học · Nguyên tử, chất, công thức, phản ứng',rules:`CHUYÊN MÔN HÓA HỌC
- Kiểm tra cấu tạo chất, nguyên tử/phân tử, công thức hóa học, hóa trị, tính chất, phản ứng và tính toán theo đúng chương trình.
- Kiểm tra kí hiệu nguyên tố, chỉ số, hệ số và cân bằng phương trình; với bài toán phải kiểm tra bảo toàn nguyên tố/khối lượng và đơn vị.
- Không tạo phản ứng hoặc tính chất không có cơ sở; ghi needsReview=true nếu công thức trong ảnh không đọc chắc chắn.`},
  'Sinh học':{label:'Sinh học · Cấu tạo, chức năng, quá trình, hệ sinh thái',rules:`CHUYÊN MÔN SINH HỌC
- Tập trung cấu trúc và chức năng, tế bào, cơ thể, di truyền, sinh lí, sinh vật và môi trường theo phạm vi tài liệu.
- Phân biệt chính xác các thuật ngữ, cơ quan, quá trình và quan hệ sinh học; không đảo lẫn nguyên nhân với kết quả.
- Câu hỏi về sơ đồ/chu trình phải bám đúng nhãn và chiều mũi tên nhìn thấy; không đoán phần bị che/mờ.`},
  'Lịch sử và Địa lí':{label:'Lịch sử và Địa lí · Tích hợp hai phân môn',rules:`CHUYÊN MÔN LỊCH SỬ VÀ ĐỊA LÍ
- Gắn mỗi câu với phân môn Lịch sử hoặc Địa lí trong topic; không trộn dữ kiện hai phân môn trong một câu nếu không có yêu cầu tích hợp rõ.
- Lịch sử: kiểm tra mốc thời gian, bối cảnh, sự kiện, nguyên nhân, kết quả và ý nghĩa. Địa lí: kiểm tra vị trí, đặc điểm tự nhiên, dân cư, kinh tế, bản đồ và số liệu.
- Giữ nguyên nguồn, niên đại, đơn vị và địa danh trong tài liệu; không suy đoán dữ kiện thiếu.`},
  'Giáo dục kinh tế và pháp luật':{label:'Giáo dục kinh tế và pháp luật · Kinh tế, pháp luật, công dân',rules:`CHUYÊN MÔN GIÁO DỤC KINH TẾ VÀ PHÁP LUẬT
- Phân loại rõ kiến thức kinh tế hoặc pháp luật; hỏi về khái niệm, vai trò, nguyên tắc, quyền/nghĩa vụ và tình huống áp dụng.
- Phân biệt kiến thức mô tả trong tài liệu với quy định pháp luật có thể thay đổi theo thời gian. Không tự bổ sung số điều, mức phạt hoặc quy định hiện hành nếu nguồn không cung cấp.
- Tình huống phải có đủ dữ kiện để xác định phương án phù hợp; explanation chỉ rõ nguyên tắc được áp dụng.`},
  'Khác':{label:'Prompt tổng quát · Bám sát tài liệu và môn học được ghi rõ',rules:`CHUYÊN MÔN KHÁC
- Xác định lĩnh vực dựa trên tài liệu và giữ nguyên thuật ngữ chuyên môn.
- Tạo câu hỏi từ kiến thức có căn cứ, tránh suy diễn hoặc bổ sung dữ kiện ngoài tài liệu.
- Câu hỏi phải rõ ràng, có một đáp án tốt nhất và giải thích ngắn.`}
 };
 return guides[subject]||guides['Khác'];
}
function studioBuildExternalPrompt(){
 const subject=studioCanonicalSubject($('#studioSubject')?.value||STUDIO_SUBJECT),grade=$('#studioGrade')?.value||STUDIO_GRADE,title=($('#studioTitle')?.value||STUDIO_TITLE).trim(),guide=studioSubjectPromptInfo(subject);
 return `Bạn là giáo viên bộ môn có kinh nghiệm biên soạn câu hỏi kiểm tra. Hãy đọc toàn bộ ảnh tài liệu/đề cương tôi đính kèm và tạo bộ câu hỏi ôn tập tương thích với Coconut Quiz Arena.\n\nTHÔNG TIN BỘ ĐỀ\n- Môn học: ${subject}\n- Lớp: ${grade}\n- Tên bộ đề: ${title||'(hãy tự đặt tên ngắn gọn)'}\n- Bộ hướng dẫn đang chọn: ${guide.label}\n\n${guide.rules}\n\nYÊU CẦU CHUNG\n1. Đọc ảnh theo đúng thứ tự; giữ nguyên nội dung, thuật ngữ, số liệu, mốc thời gian, kí hiệu và ý nghĩa của tài liệu. Nếu ảnh có nhiều trang, không bỏ sót trang nào.\n2. Ưu tiên trích xuất câu hỏi có sẵn. Có thể tạo thêm câu ôn tập mới từ kiến thức thể hiện trong ảnh, nhưng phải có căn cứ rõ ràng và phù hợp lớp ${grade}.\n3. Chỉ tạo hai dạng được Coconut hỗ trợ: trắc nghiệm 4 lựa chọn (MCQ) và Đúng/Sai (TF). Không tạo tự luận hoặc câu trả lời ngắn.\n4. MCQ phải có đúng 4 lựa chọn A–D, chỉ một đáp án đúng tốt nhất; các lựa chọn cùng kiểu, hợp lý, không đánh đố bằng cách diễn đạt. answerIndex đánh số từ 0: A=0, B=1, C=2, D=3.\n5. Câu Đúng/Sai dùng answerBoolean: true=Đúng, false=Sai. Mỗi câu chỉ nêu một nhận định, không ghép nhiều mệnh đề khiến đáp án nhập nhằng.\n6. Mỗi câu phải có explanation ngắn, difficulty (easy/medium/hard), topic, source (trang/ảnh/đoạn) và needsReview (true/false). Explanation phải giải thích vì sao đáp án đúng, không chỉ lặp lại đáp án.\n7. Không đoán chữ/số/kí hiệu bị mờ; không tự suy ra đáp án thiếu căn cứ; không bịa dữ kiện, phương án, trích dẫn hoặc nguồn. Nếu chưa chắc, đặt needsReview=true và ghi rõ phần cần người dùng kiểm tra.\n8. Không lặp câu hỏi hoặc tạo nhiều câu chỉ khác cách diễn đạt. Bám sát tài liệu; không bổ sung kiến thức ngoài nếu tôi chưa yêu cầu.\n9. Phân bố câu hỏi hợp lý theo các chủ đề có trong ảnh; không ép tạo số lượng câu cố định nếu tài liệu không đủ nội dung. Ưu tiên chính xác hơn số lượng.\n10. Trước khi xuất tệp, tự rà soát: số câu, đáp án, độ rõ ràng, tính duy nhất, sự phù hợp lớp học và tính nhất quán giữa câu hỏi – đáp án – giải thích.\n\nĐỊNH DẠNG ĐẦU RA ƯU TIÊN: TẠO TỆP .JSON ĐỂ TẢI XUỐNG, theo cấu trúc chính xác sau (thay dữ liệu ví dụ bằng câu hỏi thực):\n{\n  "title": "Tên bộ đề",\n  "subject": "${subject}",\n  "grade": ${Number(grade)||9},\n  "questions": [\n    {"type":"mcq","question":"Nội dung câu hỏi","options":["Phương án A","Phương án B","Phương án C","Phương án D"],"answerIndex":0,"explanation":"Giải thích ngắn","difficulty":"medium","topic":"Chủ đề","source":"Trang 1","needsReview":false},\n    {"type":"tf","question":"Một nhận định cần đánh giá","answerBoolean":true,"explanation":"Giải thích ngắn","difficulty":"easy","topic":"Chủ đề","source":"Trang 1","needsReview":false}\n  ]\n}\n\nNếu không thể tạo JSON, hãy tạo tệp CSV UTF-8 có hàng tiêu đề chính xác:\ntype,question,A,B,C,D,answer,explanation,difficulty,topic,source,needsReview\nVới MCQ: type=mcq; điền A/B/C/D; answer là A/B/C/D. Với Đúng/Sai: type=tf; để trống A/B/C/D; answer là Đúng hoặc Sai.\n\nHãy đính kèm tệp CSV/JSON có thể tải xuống, không trả bảng Markdown. Nếu nền tảng không hỗ trợ tệp đính kèm, chỉ xuất một khối JSON hợp lệ hoặc một khối CSV hoàn chỉnh, không thêm lời dẫn vào bên trong khối dữ liệu.`;
}
async function studioCopyPrompt(){const prompt=studioBuildExternalPrompt();try{await navigator.clipboard.writeText(prompt);toast('Đã sao chép prompt. Hãy mở AI bên ngoài, gửi ảnh và dán prompt.')}catch(e){const ta=document.createElement('textarea');ta.value=prompt;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'Đã sao chép prompt.':'Không thể tự sao chép; hãy chọn và copy nội dung trong ô prompt.')}}
function studioRefreshPromptPreview(){const el=$('#studioPromptPreview');if(el)el.value=studioBuildExternalPrompt()}
function studioDownloadPrompt(){const subject=studioCanonicalSubject($('#studioSubject')?.value||STUDIO_SUBJECT).replace(/[^\p{L}\p{N}]+/gu,'-');const blob=new Blob([studioBuildExternalPrompt()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Coconut-AI-Prompt-${subject}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function studioClearPaste(){const el=$('#studioPasteContent');if(el)el.value='';toast('Đã xóa nội dung đã dán.')}
function studioImport(){
 const picked=STUDIO_RESULT.map((q,i)=>({q,i})).filter(x=>x.q.include!==false);if(!picked.length)return toast('Chọn ít nhất một câu hỏi.');
 const bad=picked.filter(({q})=>!studioQuestionValid(q));if(bad.length)return toast(`Có ${bad.length} câu chưa hợp lệ. Sửa nội dung, đủ 4 phương án và chọn đáp án trước khi nhập.`);
 const accepted=picked.map(item=>item.q);
 const subject=studioCanonicalSubject($('#studioSubject')?.value||STUDIO_SUBJECT),grade=$('#studioGrade')?.value||STUDIO_GRADE,title=($('#studioTitle')?.value||STUDIO_TITLE).trim()||`${subject} ${grade} – Bộ câu hỏi từ tài liệu`,id='import-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),qs=accepted.map(q=>{const o={t:q.t,a:q.a};if(q.tf)o.tf=1;else o.o=q.o.slice(0,4);if(q.e)o.e=q.e;if(q.d)o.d=q.d;if(q.topic)o.topic=q.topic;if(q.source)o.source=q.source;if(q.needsReview)o.needsReview=true;return o;});
 const set={id,rev:1,subj:subject,chap:`Lớp ${grade} › AI Study Studio`,name:title,src:`Nhập từ ${STUDIO_SOURCE_FILE||'đầu ra AI'} · ${new Date().toLocaleString('vi-VN')}`,qs};
 // Atomic write: do not mutate live DB until localStorage confirms the complete new state.
 try{const next={...DB,sets:[...DB.sets,set]},serialized=JSON.stringify(next);localStorage.setItem(K,serialized);DB.sets=next.sets;const info={id,name:title,at:Date.now(),count:qs.length};STUDIO_LAST_IMPORT=info;try{localStorage.setItem('cqa_last_import',JSON.stringify(info))}catch(e){}OPEN[id]=true;STUDIO_STATUS=`Đã nhập ${qs.length} câu vào “${title}”.`;V='bank';R();toast(`Đã nhập ${qs.length} câu. Có thể hoàn tác ở màn AI Studio.`)}catch(err){toast('Không thể lưu bộ đề. Dữ liệu cũ được giữ nguyên. Hãy tải backup hoặc giải phóng bộ nhớ trình duyệt.');console.error('Atomic import failed',err)}
}

function vLb(){const l=DB.hist.filter(h=>h.mode=='speed'&&h.full&&(!LF||h.sid==LF)).sort(cmp);
 return `<h2>Bảng xếp hạng Speedrun</h2><p class=m>Lưu trên thiết bị này. Xếp theo độ chính xác, điểm, rồi thời gian.</p><div class=row style="justify-content:flex-start;margin-bottom:12px"><select data-f=1><option value="">Tất cả bộ đề${DB.sets.map(s=>`<option value="${E(s.id)}"${LF==s.id?' selected':''}>${E(s.name)}`).join('')}</select><button data-a=clrlb>Xóa bảng</button></div>`+(l.length?l.map((h,i)=>`<div class=card>#${i+1} <b>${E(h.name)}</b> · ${E(h.sn)}<br><small>${h.ok}/${h.n} đúng · ${h.acc}% · ${h.sc} điểm · ${fmt(h.ms)} · ${new Date(h.d).toLocaleDateString('vi-VN')}</small></div>`).join(''):'<p class=card>Chưa có lượt Speedrun hoàn thành nào.</p>')}
const vHist=()=>'<h2>Lịch sử</h2>'+(DB.hist.length?'<button data-a=clrh>Xóa lịch sử</button><br><br>'+DB.hist.slice().reverse().slice(0,100).map(h=>`<div class=card><b>${E(h.sn)}</b> · ${MODES[h.mode]}<br><small>${new Date(h.d).toLocaleString('vi-VN')} · ${h.ok} đúng / ${h.no} sai / ${h.blank} trống · ${h.acc}% · ${h.sc} điểm · ${fmt(h.ms)}</small></div>`).join(''):'<p class=card>Chưa có lịch sử chơi.</p>');

function vStat(){const H=DB.hist;if(!H.length)return '<h2>Thống kê</h2><p class=card>Chưa có lịch sử chơi.</p>';
 const ok=H.reduce((n,h)=>n+h.ok,0),no=H.reduce((n,h)=>n+h.no,0),sj={};H.forEach(h=>{const x=sj[h.subj]=sj[h.subj]||{p:0,ok:0,no:0};x.p++;x.ok+=h.ok;x.no+=h.no});
 const st=[['Lượt chơi',H.length],['Câu đã làm',ok+no],['Đúng',ok],['Sai',no],['Chính xác',Math.round(ok/Math.max(ok+no,1)*100)+'%'],['Điểm cao nhất',Math.max(...H.map(h=>h.sc))],['Thời gian luyện',fmt(H.reduce((n,h)=>n+h.ms,0))],['Câu cần ôn',Object.keys(DB.wrong).length]];
